er;color:#ddd;font-size:12px}.hint span{display:inline-block;background:#0008;border-radius:999px;padding:5px 8px;margin:3px}.play{display:grid;grid-template-columns:auto auto auto 1fr auto;gap:9px;align-items:center}button{min-height:44px;border:0;border-radius:10px;padding:9px 14px;background:var(--gold);color:#18120a;font-weight:800}button.alt{background:#24272e;color:#fff;border:1px solid var(--line)}button:disabled{opacity:.4}.time{min-width:0}.times{display:flex;justify-content:space-between;color:#999;font-size:12px}.spec{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;padding:1px;background:var(--line)}.spec div{background:var(--panel);padding:12px}.spec strong,.spec span{display:block}.spec strong{color:#f6d98b;font-size:13px}.spec span{color:#aaa;font-size:12px;margin-top:4px}.status{padding:9px 12px;border-radius:10px;background:#101216;border:1px solid var(--line);color:#ccc;font-size:12px}footer{text-align:center;color:#888;font-size:12px;padding:5px 12px 24px}@media(max-width:900px){.controls{grid-template-columns:1fr 1fr}.file{grid-column:1/-1}.play{grid-template-columns:repeat(3,1fr)}.time{grid-column:1/-1;grid-row:1}.reset{grid-column:1/-1}.spec{grid-template-columns:1fr 1fr}}@media(max-width:560px){.controls{grid-template-columns:1fr}.file{grid-column:auto}.viewer{height:57vh}.play{grid-template-columns:1fr 1fr}.restart{grid-column:1/-1}.spec{grid-template-columns:1fr}#rig{width:155px;height:305px}.screen{width:148px;height:282px;border-width:6px}.u-shape .left{transform:translateX(-148px) translateZ(74px) rotateY(90deg)}.u-shape .right{transform:translateX(148px) translateZ(74px) rotateY(-90deg)}.base{left:-13px;width:174px;height:26px;bottom:-23px}.u-shape .base{left:-158px;width:470px}.tower-style .supports{left:-168px;width:490px;bottom:-45px}.tower-style .screen{border-width:8px}}
</style></head><body><header><h1>心禹 LED 虛擬播放器 V2</h1><p>Corrected U-Shape Edition · P2.604</p></header><main><section class="box controls"><div class="control file"><label>匯入影片或圖片</label><input id="file" type="file" accept="video/mp4,video/quicktime,video/webm,image/*"><small>建議影片格式：MP4（H.264＋AAC）。檔案只在目前裝置瀏覽器中讀取。</small></div><div class="control"><label>顯示模型</label><select id="model"><option value="single">一境光幕屏</option><option value="triple">三境光幕屏（ㄇ字型）</option><option value="tower">三面 LED 精神堡壘（ㄇ字型）</option></select></div><div class="control"><label>場景模式</label><select id="scene"><option value="">室內展廳</option><option value="day">白天</option><option value="night">夜晚</option><option value="wedding">婚宴</option><option value="temple">宮廟／廟會</option></select></div><div class="control"><label>LED 亮度 <span id="bv">100%</span></label><input id="bright" type="range" min="30" max="160" value="100"></div><div class="control"><label>發光強度 <span id="gv">40%</span></label><input id="glow" type="range" min="0" max="100" value="40"><label style="margin-top:8px"><input id="pixel" type="checkbox" checked> LED 像素紋理</label></div></section><section id="viewer" class="box viewer"><div class="floor"></div><div id="rig"><div class="screen front"><div class="media"><div class="placeholder"><b>請匯入影片或圖片</b><span>支援滑鼠與觸控旋轉、縮放</span></div></div></div><div class="screen left"><div class="media"></div></div><div class="screen right"><div class="media"></div></div><div class="base"></div><div class="supports"></div></div><div class="hint"><span>拖曳：旋轉</span><span>雙指／滾輪：縮放</span><span>雙擊：重設</span></div></section><section class="box play"><button id="play" disabled>播放</button><button id="mute" class="alt" disabled>靜音</button><button id="restart" class="alt restart" disabled>從頭播放</button><div class="time"><input id="seek" type="range" min="0" max="1000" value="0" disabled><div class="times"><span id="now">00:00</span><span id="dur">00:00</span></div></div><button id="reset" class="alt reset">重設視角</button></section><div id="status" class="status">目前模型：一境光幕屏｜單面顯示</div><section class="box spec"><div><strong>一境光幕屏</strong><span>單面 100 × 200 cm</span></div><div><strong>三境光幕屏</strong><span>正面＋左右兩側90°，ㄇ字型</span></div><div><strong>三面 LED 精神堡壘</strong><span>正面＋左右兩側90°，ㄇ字型</span></div><div><strong>標準點距</strong><span>P2.604</span></div></section></main><footer>心禹國際開發科技有限公司 · V2 內部測試版</footer><script>
const q=id=>document.getElementById(id),rig=q('rig'),viewer=q('viewer'),file=q('file'),model=q('model'),scene=q('scene'),play=q('play'),mute=q('mute'),restart=q('restart'),seek=q('seek'),now=q('now'),dur=q('dur'),status=q('status');let url=null,videos=[],primary=null,rx=-8,ry=-20,scale=1,drag=false,lx=0,ly=0,pinch=null;const fmt=s=>Number.isFinite(s)?String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0'):'00:00';function transform(){rig.style.setProperty('--rx',rx+'deg');rig.style.setProperty('--ry',ry+'deg');rig.style.setProperty('--s',scale)}function reset(){rx=-8;ry=model.value==='single'?0:-20;scale=model.value==='single'?1:.78;transform()}function enabled(x){[play,mute,restart,seek].forEach(e=>e.disabled=!x)}function applyModel(){rig.className='';if(model.value==='triple')rig.className='u-shape';if(model.value==='tower')rig.className='u-shape tower-style';if(model.value==='triple')status.textContent='目前模型：三境光幕屏｜正面＋左右兩側90°ㄇ字型';else if(model.value==='tower')status.textContent='目前模型：三面 LED 精神堡壘｜正面＋左右兩側90°ㄇ字型';else status.textContent='目前模型：一境光幕屏｜單面顯示';reset()}model.onchange=applyModel;scene.onchange=()=>viewer.className='box viewer '+scene.value;q('bright').oninput=e=>{rig.style.setProperty('--b',e.target.value/100);q('bv').textContent=e.target.value+'%'};q('glow').oninput=e=>{rig.style.setProperty('--g',Math.round(e.target.value*.45)+'px');q('gv').textContent=e.target.value+'%'};q('pixel').onchange=e=>rig.classList.toggle('nopixel',!e.target.checked);file.onchange=()=>{const f=file.files[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);videos=[];primary=null;document.querySelectorAll('.media').forEach((m,i)=>{m.innerHTML='';if(f.type.startsWith('video/')){const v=document.createElement('video');v.src=url;v.playsInline=true;v.setAttribute('playsinline','');v.loop=true;v.muted=i>0;m.append(v);videos.push(v);if(i===0)primary=v}else{const img=document.createElement('img');img.src=url;img.alt='使用者匯入的 LED 顯示內容';m.append(img)}});enabled(!!primary);if(primary){primary.onloadedmetadata=()=>dur.textContent=fmt(primary.duration);primary.ontimeupdate=()=>{if(primary.duration){seek.value=primary.currentTime/primary.duration*1000;now.textContent=fmt(primary.currentTime);videos.slice(1).forEach(v=>{if(Math.abs(v.currentTime-primary.currentTime)>.18)v.currentTime=primary.currentTime})}};primary.onplay=()=>{play.textContent='暫停';videos.slice(1).forEach(v=>v.play().catch(()=>{}))};primary.onpause=()=>{play.textContent='播放';videos.slice(1).forEach(v=>v.pause())}}};play.onclick=async()=>{if(!primary)return;try{primary.paused?await primary.play():primary.pause()}catch(e){alert('此影片無法播放，請轉成 MP4（H.264＋AAC）後再試。')}};mute.onclick=()=>{primary.muted=!primary.muted;mute.textContent=primary.muted?'開啟聲音':'靜音'};restart.onclick=()=>{videos.forEach(v=>v.currentTime=0);primary.play().catch(()=>{})};seek.oninput=()=>{if(primary&&primary.duration){const t=seek.value/1000*primary.duration;videos.forEach(v=>v.currentTime=t)}};q('reset').onclick=reset;viewer.ondblclick=reset;viewer.onwheel=e=>{e.preventDefault();scale=Math.max(.45,Math.min(1.7,scale-e.deltaY*.001));transform()};viewer.onpointerdown=e=>{if(e.pointerType==='touch'&&!e.isPrimary)return;drag=true;lx=e.clientX;ly=e.clientY};viewer.onpointermove=e=>{if(!drag||e.pointerType==='touch'&&!e.isPrimary)return;ry+=(e.clientX-lx)*.35;rx-=(e.clientY-ly)*.25;rx=Math.max(-38,Math.min(26,rx));lx=e.clientX;ly=e.clientY;transform()};viewer.onpointerup=viewer.onpointercancel=()=>drag=false;viewer.addEventListener('touchmove',e=>{if(e.touches.length!==2){pinch=null;return}e.preventDefault();const a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pinch)scale=Math.max(.45,Math.min(1.7,scale*d/pinch));pinch=d;transform()},{passive:false});viewer.ontouchend=()=>pinch=null;if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});applyModel();
</script></body></html>
